<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cuaderno de Tratamiento UHCIP</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;font-size:10px;background:#f0f2f5}
header{background:#1e3a5f;color:#fff;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
header h1{font-size:14px;font-weight:bold}
header p{font-size:10px;opacity:.8}
.btns{display:flex;gap:8px;flex-wrap:wrap}
button{padding:6px 13px;border:none;border-radius:4px;cursor:pointer;font-size:11px;font-weight:bold;color:#fff}
.b-main{background:#1e3a5f}
.b-back{background:#555}
.b-print{background:#c0392b}
.b-dl{background:#27ae60}
button:disabled{background:#999;cursor:not-allowed}
#entrada{padding:16px;max-width:740px;margin:0 auto}
.card{background:#fff;border-radius:8px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.card h2{color:#1e3a5f;font-size:13px;margin-bottom:6px}
.card p{font-size:11px;color:#555;margin-bottom:10px}
textarea#txtin{width:100%;padding:8px;border:1px solid #ccc;border-radius:4px;font-size:11px;font-family:monospace;resize:vertical;line-height:1.5}
.err{background:#f8d7da;color:#721c24;padding:8px;border-radius:4px;margin-bottom:8px;font-size:11px}
.warn{background:#fff3cd;border:1px solid #ffc107;padding:5px 10px;margin:5px 8px;font-size:10px;border-radius:4px}
.hint{padding:2px 8px 4px;color:#666;font-size:10px;font-style:italic}
#cuaderno{padding:0 8px 8px;display:none}
table{width:100%;border-collapse:collapse;border:2px solid #333;table-layout:fixed}
td{border:1px solid #444;padding:2px 4px;vertical-align:middle}
.th{font-weight:bold;background:#e8e8e8}
.tc{text-align:center}
.fds{font-weight:bold;text-decoration:underline;background:#f5f0e8!important}
.ci{width:100%;border:none;background:transparent;font-family:Arial,sans-serif;font-size:9px;padding:0;outline:none}
.ci:focus{background:#fffde7;outline:1px solid #1e3a5f;border-radius:2px}
.cta{width:100%;border:none;background:transparent;font-family:Arial,sans-serif;font-size:9px;padding:0;outline:none;resize:none;line-height:1.4}
.cta:focus{background:#fffde7;outline:1px solid #1e3a5f;border-radius:2px}
.hoy{background:#fffde7!important}
@media print{
  @page{size:letter landscape;margin:5mm}
  header,.btns,.np{display:none!important}
  body{background:#fff;margin:0;padding:0;width:100%}
  #cuaderno{display:block!important;padding:0;width:100%}
  table{font-size:7pt!important;width:100%!important;margin:0!important}
  td{padding:1px 2px!important}
  .ci,.cta{font-size:7pt!important;border:none!important;outline:none!important;background:transparent!important}
  .cta{overflow:visible!important}
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
}
</style>
</head>
<body>

<header>
  <div><h1>Cuaderno de Tratamiento Digital</h1><p>Servicio de Psiquiatr&iacute;a H.G.G.B.</p></div>
  <div class="btns">
    <button class="b-back np" id="btnBack" onclick="irEntrada()" style="display:none">&#9998; Entrada</button>
    <button class="b-print np" id="btnPrint" onclick="confirmarImpresion()" style="display:none">&#128424; Imprimir</button>
  </div>
</header>

<div id="entrada">
  <div class="card">
    <h2>Ingresar indicaciones m&eacute;dicas</h2>
    <p>Pega el texto tal como lo escribe el m&eacute;dico. El sistema clasificar&aacute; cada l&iacute;nea autom&aacute;ticamente.</p>
    <div class="err" id="errBox" style="display:none"></div>
    <textarea id="txtin" rows="15" placeholder="Nombre paciente: María González&#10;Médico tratante: Dr. Pereira&#10;Diagnóstico: Esquizofrenia paranoide&#10;Alergias: No refiere&#10;Olanzapina 10mg 1-0-1 vo&#10;Quetiapina 100mg 0-1 vo&#10;10) SOS&#10;-Agitación: Haloperidol 5mg IM&#10;-Insomnio: Quetiapina 25mg vo&#10;-Distonía: Diazepam 10mg EV lento&#10;Indicaciones de enfermería:&#10;- Vigilancia 24 hrs&#10;- CSV cada 8 hrs"></textarea>
    <button class="b-main np" style="width:100%;padding:10px;font-size:13px;margin-top:10px" id="btnProc" onclick="procesar()">&#9654; Procesar y completar cuaderno</button>
  </div>
</div>

<div id="cuaderno">
  <div class="warn np" id="niBox" style="display:none"></div>
  <p class="hint np">&#128161; Todas las celdas son editables &mdash; haz clic para completar o corregir.</p>
  <table id="tbl"></table>
</div>

<script>
var SSUP=['\u2070','\u00b9','\u00b2','\u00b3','\u2074','\u2075','\u2076','\u2077','\u2078','\u2079'];
function toSup(n){var s=String(Math.floor(Math.abs(n))),r='';for(var i=0;i<s.length;i++)r+=SSUP[+s[i]];return r;}
function pFrac(s){
  if(!s)return 0;
  s=s.trim().replace(/\u00bd/g,'1/2').replace(/\u00bc/g,'1/4').replace(/\u00be/g,'3/4').replace(/,/g,'.');
  var m=s.match(/^(\d+)\s+(\d+)\/(\d+)$/);if(m)return +m[1]+ +m[2]/+m[3];
  m=s.match(/^(\d+)\/(\d+)$/);if(m)return +m[1]/+m[2];
  var v=parseFloat(s);return isNaN(v)?0:v;
}
function fmtC(n){
  if(!n||n===0)return'';
  var e=Math.floor(n),d=Math.round((n-e)*4);
  var fr=d===1?'\u00bc':d===2?'\u00bd':d===3?'\u00be':'';
  return(e>0?toSup(e):'')+fr;
}
function xV(t){var i=t.indexOf(':');return i>=0?t.slice(i+1).trim():t.trim();}
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function xH(tx){
  var lo=tx.toLowerCase(),h=[];
  function add(hora,comp){hora=String(hora);for(var k=0;k<h.length;k++)if(h[k].hora===hora)return;h.push({hora:hora,comp:comp||1});}
  var m3=tx.match(/([\d\u00bd\u00bc\u00be\/,\.]+)\s*-\s*([\d\u00bd\u00bc\u00be\/,\.]+)\s*-\s*([\d\u00bd\u00bc\u00be\/,\.]+)/);
  if(m3){
    var a=[['9',m3[1]],['14',m3[2]],['21',m3[3]]];
    for(var i=0;i<a.length;i++){var c=pFrac(a[i][1]);if(c>0)add(a[i][0],c);}
    if(h.length>0)return h;
  }
  var sd=tx.replace(/\d+([,\.]\d+)?\s*(mg|g|ml|mcg|ui|cc|gr|amp|%)/gi,'');
  var m2=sd.match(/([\d\u00bd\u00bc\u00be\/,\.]+)\s*-\s*([\d\u00bd\u00bc\u00be\/,\.]+)/);
  if(m2){var v1=pFrac(m2[1]),v2=pFrac(m2[2]);if(v1>=0&&v1<=5&&v2>=0&&v2<=5&&(v1>0||v2>0)){if(v1>0)add('9',v1);if(v2>0)add('21',v2);if(h.length>0)return h;}}
  var re=/\b(0?\d|1\d|2[0-3]):([0-5]\d)\b/g,mx;
  while((mx=re.exec(tx))!==null)add(parseInt(mx[1]));
  if(lo.indexOf('cada 6')>=0||lo.indexOf('c/6')>=0){add('6');add('12');add('18');add('0');}
  if(lo.indexOf('cada 8')>=0||lo.indexOf('c/8')>=0){add('6');add('14');add('22');}
  if(lo.indexOf('cada 12')>=0||lo.indexOf('c/12')>=0||lo.indexOf('2 veces')>=0){add('9');add('21');}
  if(lo.indexOf('cada 24')>=0||lo.indexOf('c/24')>=0||lo.indexOf('al dia')>=0||lo.indexOf('diario')>=0||lo.indexOf('1 vez')>=0)add('9');
  if(lo.indexOf('3 veces')>=0||lo.indexOf('tres veces')>=0){add('9');add('14');add('21');}
  if(lo.indexOf('ma\xf1ana')>=0||lo.indexOf('desayuno')>=0)add('9');
  if(lo.indexOf('almuerzo')>=0||lo.indexOf('mediod\xeda')>=0)add('14');
  if(lo.indexOf('tarde')>=0&&lo.indexOf('m\xe1s tarde')<0)add('15');
  if(lo.indexOf('noche')>=0||lo.indexOf(' hs')>=0||lo.indexOf('cena')>=0||lo.indexOf('antes de dormir')>=0)add('21');
  if(lo.indexOf('mensual')>=0||lo.indexOf('cada 14')>=0||lo.indexOf('cada 13')>=0||lo.indexOf('cada 30')>=0||lo.indexOf('cada 3 meses')>=0||lo.indexOf('semanal')>=0||lo.indexOf('cada 7')>=0)return[{hora:'VER',comp:null}];
  return h;
}
function bH(hh){
  if(!hh||!hh.length)return'';
  if(hh[0].hora==='VER')return'VER IND.';
  var s=[];for(var i=0;i<hh.length;i++)if(!isNaN(parseInt(hh[i].hora)))s.push(hh[i]);
  s.sort(function(a,b){return parseInt(a.hora)-parseInt(b.hora);});
  var o=[];for(var j=0;j<s.length;j++)o.push(s[j].hora+fmtC(s[j].comp||1));
  return o.join('  ');
}

function clas(ln){
  var lo=ln.toLowerCase().trim();
  if(ln.trim().length<=2)return'I';
  if(/^[\d\s\W]+$/.test(ln.trim())&&ln.trim().length<5)return'I';
  var desc=['terapia ocupacional','trabajo social','nutricionista','psicolog\xeda','psicodiagn\xf3stico','hospitalizaci\xf3n voluntaria','hospitalizaci\xf3n involuntaria','entrevista familiar','solicito examen','se programa alta','alta para el','control post-alta','formulario','regulariza midas','test de drogas','emito receta','ex\xe1menes de ingreso','estudio de organicidad','vacun','hip\xf3tesis diagn\xf3stica','evaluaci\xf3n por psicolog\xeda','ev por t social','despacho en ueh'];
  for(var di=0;di<desc.length;di++)if(lo.indexOf(desc[di])>=0)return'D';
  if(/\bs\.?o\.?s\b/i.test(ln)){
    // CAMBIO 2: ignorar SOS no farmacológicos (evaluación, traslado, interconsulta, llamar a médico, control)
    if(lo.indexOf('evaluaci')>=0||lo.indexOf('traslado')>=0||lo.indexOf('interconsulta')>=0||lo.indexOf('llamar a m')>=0||lo.indexOf('control')>=0||lo.indexOf('urgencia')>=0)return'I';
    if(lo.indexOf('contencion')>=0||lo.indexOf('contenci\xf3n')>=0)return'ENF';
    if(lo.indexOf('traslado sos')>=0||lo.indexOf('su hggb')>=0||lo.indexOf('su hrc')>=0)return'ENF';
    if(/^\s*(\d+[\).:]?\s*)?s\.?o\.?s\s*:?\s*$/.test(lo)||lo.indexOf('f\xe1rmacos sos')>=0||lo.indexOf('farmacos sos')>=0||lo.indexOf('indicaciones sos')>=0)return'ESOS';
    return'SOS';
  }
  // "Si presenta X..." → SOS si contiene palabra clave de tipo SOS
  if(lo.indexOf('si presenta')>=0||lo.indexOf('en caso de')>=0){
    var sosPalabras=['agitaci','insomnio','diston','convuls','angustia','ansiedad','dolor','fiebre','deposicion','constipaci'];
    for(var sp2=0;sp2<sosPalabras.length;sp2++)if(lo.indexOf(sosPalabras[sp2])>=0)return'SOS';
  }
  if(/^(dr\.?a?|dra\.?)\s+[a-z\xe1\xe9\xed\xf3\xfa\xf1]/i.test(ln.replace(/^\s*\d+[.):\-]\s*/,''))&&lo.indexOf('mg')<0)return'MED';
  if(lo.indexOf('diagn\xf3s')===0||lo.indexOf('diagno')===0||lo.indexOf('dg ')===0)return'DX';
  if(lo.indexOf('alergi')===0)return'AL';
  var dk=['depot','decanoato','consta','cisordinol'];
  for(var ki=0;ki<dk.length;ki++)if(lo.indexOf(dk[ki])>=0)return'DEP';
  if(lo.indexOf(' im')>=0&&(lo.indexOf('cada 14')>=0||lo.indexOf('cada 13')>=0||lo.indexOf('cada 30')>=0||lo.indexOf('cada 3 meses')>=0))return'DEP';
  // CAMBIO 3: Depo-prodasone/prodasona agregados como nombres comerciales de Sayana
  if(lo.indexOf('sayana')>=0||lo.indexOf('depo-prodasone')>=0||lo.indexOf('depo prodasone')>=0||lo.indexOf('depo-prodasona')>=0||lo.indexOf('depo prodasona')>=0||lo.indexOf('acetato de medroxiprogesterona')>=0||lo.indexOf('acetato hidroxiprogesterona')>=0||lo.indexOf('medroxiprogesterona')>=0||lo.indexOf('hidroxiprogesterona')>=0)return'ENF';
  if(lo.indexOf('nombre paciente')===0||lo.indexOf('nombre usuario')===0)return'NOM';
  if(lo.indexOf('m\xe9dico tratante')===0||lo.indexOf('medico tratante')===0)return'MEDT';
  if(lo.indexOf('indicaciones adicionales')>=0||lo.indexOf('indicaciones de enfermer')>=0||lo.indexOf('indicaciones uhcip')>=0)return'EENF';
  // CAMBIO 1: Insulina NPH → clasificar como NPH antes del catch ENF/FAR
  if(/\bnph\b/i.test(ln))return'NPH';
  if(lo.indexOf('insulina cristalina')>=0||lo.indexOf('esquema insulina')>=0||lo.indexOf('esquema refuerzo')>=0||lo.indexOf('cristalina seg')>=0||/^hgt\s*\d+/.test(lo)||(/\d+\s*[-\u2013]\s*\d+/.test(lo)&&/\d+\s*u\b/i.test(lo)))return'INS';
  var eK=['vigilancia','vigilar conducta','csv ','c/sv','control de signos','contenci\xf3n','contencion','prevenci\xf3n','r\xe9gimen','regimen','hidrataci\xf3n oral','supervisar','kinesio','ktr ','podolog\xeda','pasta lassar','medidas antitrombo','moler en caso','avisar a m\xe9dico'];
  var hD=/\d+\s*(mg|ml|mcg|ui|g|cc|amp|puff)/i.test(ln);
  for(var ei=0;ei<eK.length;ei++)if(lo.indexOf(eK[ei])>=0&&!hD)return'ENF';
  var sD=['polietilenglicol','peg ','aloe vera','fleet enema','fleet ','elcal-d','elcal ','calcio-d','vitamina d','vitamina c','acido folico','\xe1cido f\xf3lico','polivitaminico','clotrimazol','permetrina','ivermectina','lactulosa'];
  for(var si=0;si<sD.length;si++)if(lo.indexOf(sD[si])>=0)return'FSD';
  if(/\d+([,\.]\d+)?\s*(mg|g|ml|mcg|ui|amp|puff|gotas|cc|gr|%)/i.test(ln))return'FAR';
  if(lo.length>10&&!hD)return'ENF';
  return'I';
}

var TSOS=['insomnio','agitaci','diston','convuls','angustia','ansiedad','dolor','fiebre','deposicion','constipaci','fleet','hiperglicemia','n\xe1useas','nauseas','crisis','si presenta'];

function procTexto(texto){
  var lineas=texto.split('\n'),arr=[];
  for(var i=0;i<lineas.length;i++){var l=lineas[i].trim();if(l)arr.push(l);}
  var r={dx:'',al:'',depot:'',nom:'',med:'',sos:{ag:'',ino:'',di:'',lib:'',libL:'SOS __________:'},sosX:[],enf:[],ins:[],meds:[],ni:[]};
  function addSOS(ln){
    ln=ln.replace(/^\s*\d+[.):\-]\s*/,'').replace(/^\s*-\s*/,'').trim();
    var colon=ln.indexOf(':');
    var medication,condStr;
    if(colon>=0){
      medication=ln.slice(colon+1).trim();
      condStr=ln.slice(0,colon).trim();
    } else {
      var cleaned=ln.replace(/^\s*sos\s+/i,'').replace(/^en\s+caso\s+de\s+/i,'').replace(/^si\s+presenta\s+/i,'').trim();
      var numMatch=cleaned.match(/\d/);
      if(numMatch){
        var numIdx=cleaned.indexOf(numMatch[0]);
        var before=cleaned.slice(0,numIdx).trim();
        var words=before.split(/\s+/).filter(function(w){return w.length>0;});
        if(words.length>1){
          condStr=words.slice(0,words.length-1).join(' ');
          medication=cleaned.slice(cleaned.indexOf(words[words.length-1]));
        } else {
          condStr='';medication=cleaned;
        }
      } else {
        condStr='';medication=cleaned;
      }
    }
    // Separar condiciones múltiples: "y/o", "/", " y "
    var conditions=condStr.split(/\s+y\/o\s+|\s*\/\s*|\s+y\s+/i).map(function(c){return c.trim();}).filter(function(c){return c.length>0;});
    if(conditions.length===0)conditions=[''];
    function processCond(cond){
      var cl=cond.toLowerCase();
      var etq=cond?'SOS '+cond.toUpperCase():'SOS';
      if(cl.indexOf('agitaci')>=0){r.sos.ag=medication;return;}
      if(cl.indexOf('insomnio')>=0){r.sos.ino=medication;return;}
      if(cl.indexOf('diston')>=0){r.sos.di=medication;return;}
      if(cl.indexOf('angustia')>=0||cl.indexOf('ansiedad')>=0){
        if(!r.sos.lib){r.sos.lib=medication;r.sos.libL=etq+':';return;}
        r.sosX.push(etq+': '+medication);return;
      }
      if(!r.sos.lib){r.sos.lib=medication;r.sos.libL=etq+':';return;}
      r.sosX.push(etq+': '+medication);
    }
    for(var ci=0;ci<conditions.length;ci++)processCond(conditions[ci]);
  }
  var enSOS=false,enEnf=false;
  for(var j=0;j<arr.length;j++){
    var ln=arr[j],tipo=clas(ln),sn=ln.replace(/^\s*\d+[.):\-]\s*/,'').trim();
    if(enSOS){
      if(ln.trim().charAt(0)==='-'){
        var lnLow=ln.toLowerCase();
        if(lnLow.indexOf('evaluaci')>=0||lnLow.indexOf('traslado')>=0||lnLow.indexOf('interconsulta')>=0||lnLow.indexOf('llamar a m')>=0||lnLow.indexOf('control')>=0||lnLow.indexOf('urgencia')>=0){continue;}
        addSOS(ln);continue;
      }
      var lt=ln.trim().toLowerCase(),isST=false;
      for(var ti=0;ti<TSOS.length;ti++)if(lt.indexOf(TSOS[ti])===0){isST=true;break;}
      if(isST){addSOS(ln);continue;}
      if(tipo==='SOS'){addSOS(sn);continue;}
      enSOS=false;
    }
    if(enEnf){
      var stops=['FAR','FSD','SOS','ESOS','DEP','DX'],isStop=false;
      for(var sp=0;sp<stops.length;sp++)if(tipo===stops[sp]){isStop=true;break;}
      if(isStop)enEnf=false;
      else if(tipo!=='D'&&tipo!=='I'){var te=sn.replace(/^\s*-\s*/,'').trim();if(te.length>3)r.enf.push(te);continue;}
      else continue;
    }
    if(tipo==='I'||tipo==='D')continue;
    if(tipo==='ESOS'){enSOS=true;continue;}
    if(tipo==='SOS'){addSOS(sn);continue;}
    // CAMBIO 1: manejo de Insulina NPH → va a lista de fármacos con formato AM/PM
    if(tipo==='NPH'){
      var nums=(ln.match(/\d+/g)||[]).filter(function(n){return +n>0&&+n<200;});
      var nphAM=nums[0]||'';
      var nphPM=nums[1]||'';
      var nphH=(nphAM?'AM: '+nphAM+'U':'')+(nphPM?'  PM: '+nphPM+'U':'');
      var nphHH=[];
      if(nphAM)nphHH.push({hora:'9',comp:1,display:'AM:'+nphAM+'U'});
      if(nphPM)nphHH.push({hora:'21',comp:1,display:'PM:'+nphPM+'U'});
      r.meds.push({n:'Insulina NPH',h:nphH,hh:nphHH});
      continue;
    }
    if(tipo==='INS'){r.ins.push(ln.trim());continue;}
    if(tipo==='DX'){r.dx=xV(ln);continue;}
    if(tipo==='AL'){r.al=xV(ln);continue;}
    if(tipo==='DEP'){if(!r.depot)r.depot=sn;continue;}
    if(tipo==='NOM'){r.nom=xV(ln);continue;}
    if(tipo==='MED'){if(!r.med)r.med=sn;else if(r.med.indexOf(sn)<0)r.med+=' / '+sn;continue;}
    if(tipo==='MEDT'){r.med=xV(ln);continue;}
    if(tipo==='EENF'){enEnf=true;continue;}
    if(tipo==='ENF'){var t2=sn.replace(/^\s*-\s*/,'').trim();if(t2.length>3)r.enf.push(t2);continue;}
    if(tipo==='FSD'){var fsdHH=xH(ln);r.meds.push({n:sn.replace(/^\s*-\s*/,'').trim(),h:bH(fsdHH),hh:fsdHH});continue;}
    if(tipo==='FAR'){var md=pMed(sn);if(md)r.meds.push({n:md.resumen,h:bH(md.horarios),hh:md.horarios});else r.ni.push(ln);continue;}
    if(ln.trim().length>5)r.ni.push(ln);
  }
  for(var xi=0;xi<r.sosX.length;xi++)r.meds.push({n:r.sosX[xi],h:'',hh:[]});
  return r;
}
function pMed(ln){
  var vm=ln.match(/\b(VO|IM|EV|SC|SL|VR|sublingual|inhalatoria)\b/i),via=vm?vm[1].toUpperCase():null;
  var dm=ln.match(/\d+([,\.]\d+)?\s*(mg|g|ml|mcg|ui|amp|puff|gotas|cc|gr|%)/i),dosis=dm?dm[0]:'';
  var idx=dm?ln.indexOf(dm[0]):ln.length;
  var n=ln.slice(0,idx).replace(/^\s*\d+[.)]\s*/,'').replace(/^\s*-\s*/,'').trim();
  return{resumen:via?n+' '+dosis+'  ('+via+')':n+' '+dosis,horarios:xH(ln)};
}

function getFechas(){
  var dias=['Dom','Lun','Mar','Mi\xe9','Jue','Vie','S\xe1b'],hoy=new Date(),out=[];
  for(var i=0;i<7;i++){
    var f=new Date(hoy);f.setDate(hoy.getDate()+i);var d=f.getDay();
    var dd=f.getDate()<10?'0'+f.getDate():''+f.getDate();
    var mm=(f.getMonth()+1)<10?'0'+(f.getMonth()+1):''+(f.getMonth()+1);
    out.push({t:dias[d]+' '+dd+'-'+mm+'-'+f.getFullYear(),fds:d===0||d===6});
  }
  return out;
}
var FECHAS=getFechas(),N=22;

function buildTable(r){
  var insT='';
  for(var ii=0;ii<r.ins.length;ii++){
    var l=r.ins[ii],lo=l.toLowerCase();
    var line=(lo.indexOf('cristalina')>=0||lo.indexOf('esquema')>=0||lo.indexOf('refuerzo')>=0)?l:l.replace(/\s*(SC|IM|EV|VO)\b/gi,'').replace(/\s*mg\/dl/gi,'').replace(/hgt\s*/gi,'').trim();
    insT+=(insT?'\n':'')+line;
  }
  var enfT='';
  for(var ei=0;ei<r.enf.length;ei++)enfT+=(enfT?'\n':'')+'- '+r.enf[ei];
  var meds=r.meds.slice(0,N);
  while(meds.length<N)meds.push({n:'',h:''});
  var w=(78/7).toFixed(2);
  var cg='<colgroup><col style="width:22%">';
  for(var ci=0;ci<7;ci++)cg+='<col style="width:'+w+'%">';
  cg+='</colgroup>';
  var rows='';
  rows+='<tr><td colspan="8" class="th tc" style="font-size:11px;padding:5px">INDICACIONES M&Eacute;DICAS Y DE ENFERMER&Iacute;A, SERVICIO DE PSIQUIATR&Iacute;A H.G.G.B.</td></tr>';
  rows+='<tr><td colspan="5" style="padding:3px 5px"><b>DIAGN&Oacute;STICO: </b><input id="f_dx" class="ci" value="'+esc(r.dx)+'"></td><td colspan="3" style="padding:3px 5px"><b>ALERGIAS: </b><input id="f_al" class="ci" value="'+esc(r.al)+'"></td></tr>';
  rows+='<tr><td class="th" style="font-size:9px;padding:3px 5px">FECHAS:</td>';
  for(var fi=0;fi<FECHAS.length;fi++){
    var fc=FECHAS[fi].fds?' fds':'';
    rows+='<td class="tc'+fc+'" style="font-size:8px;padding:2px 1px">'+FECHAS[fi].t+'</td>';
  }
  rows+='</tr>';
  rows+='<tr><td style="padding:2px 5px"><b>NL DEPOT: </b><input id="f_dep" class="ci" value="'+esc(r.depot)+'"></td>';
  for(var di=0;di<7;di++)rows+='<td style="padding:1px"><input id="dep'+di+'" class="ci" style="text-align:center" value=""></td>';
  rows+='</tr>';
  var sosD=[['SOS Agitaci&oacute;n:','f_ag',r.sos.ag,'sag'],['SOS Insomnio:','f_in',r.sos.ino,'sin'],['SOS Diston&iacute;a:','f_di',r.sos.di,'sdi']];
  for(var si=0;si<sosD.length;si++){
    rows+='<tr><td style="padding:2px 5px"><b>'+sosD[si][0]+' </b><input id="'+sosD[si][1]+'" class="ci" value="'+esc(sosD[si][2])+'"></td>';
    for(var sj=0;sj<7;sj++)rows+='<td style="padding:1px"><input id="'+sosD[si][3]+sj+'" class="ci" style="text-align:center" value=""></td>';
    rows+='</tr>';
  }
  rows+='<tr><td style="padding:2px 4px"><input id="f_ll" class="ci" style="font-weight:bold;width:42%;display:inline-block" value="'+esc(r.sos.libL.toUpperCase())+'"><input id="f_lv" class="ci" style="width:57%;display:inline-block" value="'+esc(r.sos.lib)+'"></td>';
  for(var lj=0;lj<7;lj++)rows+='<td style="padding:1px"><input id="slib'+lj+'" class="ci" style="text-align:center" value=""></td>';
  rows+='</tr>';
  rows+='<tr><td colspan="5" style="padding:3px 5px;vertical-align:top"><div style="font-weight:bold;font-size:9px;margin-bottom:2px">INDICACIONES DE ENFERMER&Iacute;A:</div><textarea id="f_enf" class="cta" rows="4">'+esc(enfT)+'</textarea></td>';
  rows+='<td style="text-align:center;vertical-align:middle;font-weight:bold;font-size:9px;line-height:1.5;padding:3px">Esquema<br>refuerzo<br>Insulina<br>Cristalina</td>';
  rows+='<td colspan="2" style="padding:3px 5px;vertical-align:top"><textarea id="f_ins" class="cta" rows="4">'+esc(insT)+'</textarea></td></tr>';
  rows+='<tr><td colspan="8" class="th tc" style="font-size:9px;padding:3px">PLAN FARMACOL&Oacute;GICO Y DE CUIDADOS DE ENFERMER&Iacute;A POR HORARIOS &nbsp;<button class="np" onclick="replicarTodo()" title="Copiar todos los fármacos diarios a días siguientes" style="background:#27ae60;color:#fff;border:none;border-radius:3px;cursor:pointer;font-size:9px;padding:2px 6px">&#x2398; Copiar todo</button></td></tr>';
  function getSlot(h){h=parseInt(h);if(h<=3)return 4;if(h<=7)return 0;if(h<=10)return 1;if(h<=15)return 2;return 3;}
  function makeSlots(hh){
    var slots=['','','','',''];
    if(!hh||!hh.length)return slots;
    var sorted=hh.slice().sort(function(a,b){return parseInt(a.hora)-parseInt(b.hora);});
    for(var i=0;i<sorted.length;i++){
      var item=sorted[i];
      if(item.hora==='VER'){if(!slots[2])slots[2]='VER';else slots[4]='VER';continue;}
      var s=getSlot(parseInt(item.hora));
      var disp=item.display||(item.hora+fmtC(item.comp||1));
      if(!slots[s]){slots[s]=disp;continue;}
      var found=false;
      for(var d=1;d<5;d++){
        if(s-d>=0&&!slots[s-d]){slots[s-d]=disp;found=true;break;}
        if(s+d<=4&&!slots[s+d]){slots[s+d]=disp;found=true;break;}
      }
      if(!found)slots[s]+=' '+disp;
    }
    return slots;
  }
  for(var mi=0;mi<meds.length;mi++){
    var m=meds[mi],isHoy=m.h?true:false;
    rows+='<tr><td style="padding:1px 3px;height:16px"><input id="m'+mi+'n" class="ci" value="'+esc(m.n)+'" style="font-size:9px"></td>';
    for(var mj=0;mj<7;mj++){
      var hC=(mj===0&&isHoy)?' hoy':'',hBg=(mj===0&&isHoy)?'background:#fffde7;':'';
      var sv=mj===0?makeSlots(m.hh||[]):['','','','',''];
      rows+='<td class="tc'+hC+'" style="padding:0;'+hBg+'">';
      rows+='<div style="display:flex;width:100%">';
      for(var s=0;s<5;s++){
        rows+='<input id="m'+mi+'d'+mj+'s'+s+'" class="ci" value="'+esc(sv[s])+'" style="width:20%;font-size:9px;text-align:center;padding:0;min-width:0">';
      }
      rows+='</div></td>';
    }
    rows+='<td class="np" style="padding:0 2px;width:16px;vertical-align:middle"><button onclick="replicarFila('+mi+')" title="Copiar horarios a días siguientes" style="background:#1e3a5f;color:#fff;border:none;border-radius:3px;cursor:pointer;font-size:10px;padding:2px 4px;line-height:1">&#x2398;</button></td>';
    rows+='</tr>';
  }
  rows+='<tr><td colspan="5" style="padding:3px 5px"><b>NOMBRE DEL USUARIO: </b><input id="f_nom" class="ci" value="'+esc(r.nom)+'"></td><td colspan="3" style="padding:3px 5px"><b>M&Eacute;DICO TRATANTE: </b><input id="f_med" class="ci" value="'+esc(r.med)+'"></td></tr>';
  return '<table>'+cg+'<tbody>'+rows+'</tbody></table>';
}

function replicarTodo(){
  for(var mi=0;mi<N;mi++){
    var nombre=document.getElementById('m'+mi+'n');
    if(!nombre)continue;
    if(nombre.value.trim().toUpperCase().indexOf('SOS')===0)continue;
    replicarFila(mi);
  }
}
function replicarFila(mi){
  var ultimaCol=-1;
  for(var mj=0;mj<7;mj++){
    for(var s=0;s<5;s++){
      var el=document.getElementById('m'+mi+'d'+mj+'s'+s);
      if(el&&el.value.trim()){ultimaCol=mj;break;}
    }
  }
  if(ultimaCol<0||ultimaCol===6)return;
  var fuente=[];
  for(var s=0;s<5;s++){
    var el=document.getElementById('m'+mi+'d'+ultimaCol+'s'+s);
    fuente.push(el?el.value:'');
  }
  for(var mj=ultimaCol+1;mj<7;mj++){
    var colVacia=true;
    for(var s=0;s<5;s++){
      var el=document.getElementById('m'+mi+'d'+mj+'s'+s);
      if(el&&el.value.trim()){colVacia=false;break;}
    }
    if(colVacia){
      for(var s=0;s<5;s++){
        var el=document.getElementById('m'+mi+'d'+mj+'s'+s);
        if(el)el.value=fuente[s];
      }
    }
  }
}
function confirmarImpresion(){
  if(confirm('Antes de imprimir, confirme que ha revisado la tabla:\n\n¿Verificó el nombre del paciente, diagnóstico, alergias, médico tratante, fármacos e indicaciones SOS?\n\nPresione Aceptar para imprimir o Cancelar para revisar.'))window.print();
}
function irEntrada(){
  document.getElementById('entrada').style.display='block';
  document.getElementById('cuaderno').style.display='none';
  document.getElementById('btnBack').style.display='none';
  document.getElementById('btnPrint').style.display='none';
}
function procesar(){
  var txt=document.getElementById('txtin').value;
  if(!txt.trim()){alert('Ingresa las indicaciones m\xe9dicas.');return;}
  var r=procTexto(txt);
  var c=document.getElementById('cuaderno');
  c.innerHTML='<div class="warn np" id="niBox2" style="display:'+(r.ni.length?'block':'none')+'"><b>No interpretadas ('+r.ni.length+'):</b> '+r.ni.join(' | ')+'</div><p class="hint np">&#128161; Celdas editables &mdash; haz clic para completar.</p>'+buildTable(r);
  c.style.display='block';
  document.getElementById('entrada').style.display='none';
  document.getElementById('btnBack').style.display='inline-block';
  document.getElementById('btnPrint').style.display='inline-block';
}
</script>
